<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Виктория Зотова · Аналитик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: инженерная сетка. Узкий контейнер, строгие полосы, моноширинные коды ячеек как подписи. */
:root{
  --bg:#FFFFFF; --surface:#F5F7FA; --fg:#111418; --muted:#3A414B; --faint:#5B6470;
  --line:#E3E6EB; --line-strong:#111418; --cell:#C9CED6;
  --accent:#1F4FD1; --accent-hover:#163A9C; --accent-ink:#FFFFFF; --accent-soft:#EAF0FD;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141B; --surface:#161D27; --fg:#E6EBF2; --muted:#B4BDCA; --faint:#8C97A7;
  --line:#263040; --line-strong:#E6EBF2; --cell:#344155;
  --accent:#86A6FF; --accent-hover:#A9C0FF; --accent-ink:#0B1220; --accent-soft:#1A2744; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141B; --surface:#161D27; --fg:#E6EBF2; --muted:#B4BDCA; --faint:#8C97A7;
  --line:#263040; --line-strong:#E6EBF2; --cell:#344155;
  --accent:#86A6FF; --accent-hover:#A9C0FF; --accent-ink:#0B1220; --accent-soft:#1A2744; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.55;padding-inline:20px}
.wrap{max-width:1120px;margin-inline:auto}
a{color:var(--accent)} a:hover{color:var(--accent-hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
h1,h2,h3{text-wrap:balance;margin:0;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono)}
.eyebrow{font-family:var(--mono);font-size:13px;color:var(--accent);letter-spacing:.02em}
.code{font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.04em}

nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:18px;flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:500;font-size:15px;color:var(--fg);text-decoration:none}
.brand span{color:var(--accent)}
.navlinks{display:flex;gap:22px;align-items:center;font-family:var(--mono);font-size:14px;flex-wrap:wrap}
.navlinks a{color:var(--muted);text-decoration:none}
.navlinks a:hover{color:var(--fg)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{font:inherit;font-family:var(--mono);font-size:13px;background:transparent;color:var(--muted);border:0;padding:6px 10px;cursor:pointer;min-height:32px}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

header.hero{padding-block:72px 56px;display:grid;gap:24px}
.hero h1{font-size:clamp(34px,5.4vw,60px);line-height:1.06;letter-spacing:-.02em;max-width:22ch}
.hero p.lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:62ch}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:4px;font-weight:600;font-size:16px;text-decoration:none;min-height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);color:var(--accent-ink)}
.btn.ghost{border:1.5px solid var(--line-strong);color:var(--fg)}
.btn.ghost:hover{background:var(--surface);color:var(--fg)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-top:2px solid var(--line-strong)}
.stat{padding:22px 22px 24px;display:flex;flex-direction:column;gap:8px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat .n{font-size:clamp(30px,3.4vw,42px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.stat .t{font-size:15px;color:var(--muted)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat:nth-child(3){border-left:0}.stat:nth-child(n+3){border-top:1px solid var(--line)}}

section.block,footer.contact{scroll-margin-top:84px}
section.block{padding-block:72px 8px;display:grid;gap:28px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.sechead h2{font-size:clamp(26px,3vw,34px)}
.sechead h2 small{font-family:var(--mono);font-size:15px;color:var(--faint);font-weight:400;margin-left:6px}

.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.skill{background:var(--bg);padding:24px;display:grid;gap:10px;align-content:start;min-width:0}
.skill h3{font-size:19px}
.skill p{color:var(--muted);font-size:16px}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;font-family:var(--mono);font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--cell);background:transparent;color:var(--fg);cursor:pointer;min-height:36px}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

.cases{display:grid;gap:20px}
.case{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:clamp(22px,3vw,40px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px}
.case .body{display:grid;gap:16px;min-width:0}
.case h3{font-size:clamp(22px,2.4vw,28px);line-height:1.2}
.rows{display:grid;grid-template-columns:132px minmax(0,1fr);gap:10px 18px;font-size:16px}
.rows dt{font-weight:600}
.rows dd{margin:0;color:var(--muted)}
.prodnotes{display:grid;gap:8px;padding:16px 18px;background:var(--bg);border:1px solid var(--line);border-radius:4px}
.prodnotes .code{color:var(--accent)}
.prodnotes ul{margin:0;padding-left:18px;color:var(--muted);font-size:16px;display:grid;gap:6px}
.cells{width:300px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-content:center}
.cells div{height:58px;border:1px solid var(--cell);background:var(--bg);border-radius:3px;font-family:var(--mono);font-size:12px;color:var(--faint);padding:6px}
.cells div.on{border:1.5px solid var(--accent);background:var(--accent-soft);color:var(--accent)}
@media (max-width:820px){.case{grid-template-columns:minmax(0,1fr)}.cells{width:100%;max-width:340px}.rows{grid-template-columns:minmax(0,1fr)}.rows dt{margin-top:6px}}

.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mini div{border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:6px;min-width:0}
.mini b{font-weight:600}
.mini span{color:var(--muted);font-size:15px}

ol.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
ol.steps li{background:var(--bg);padding:22px;display:grid;gap:8px;align-content:start}
ol.steps h3{font-size:18px}
ol.steps p{color:var(--muted);font-size:15px}
blockquote.insight{margin:0;padding:24px 0 0;border-top:2px solid var(--line-strong);font-size:clamp(20px,2.2vw,26px);font-weight:500;max-width:40ch;line-height:1.35}

.clients{display:flex;flex-wrap:wrap;gap:10px 28px;font-size:17px;color:var(--muted)}
.industries{display:flex;flex-wrap:wrap;gap:8px}
.industries span{font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:3px;padding:5px 10px;color:var(--muted)}

.timeline{display:grid;border-top:1px solid var(--line)}
.trow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;padding-block:16px;border-bottom:1px solid var(--line)}
.trow .y{font-family:var(--mono);font-size:14px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:2px}
.trow b{font-weight:600}
.trow span{color:var(--muted)}
.note{font-size:14px;color:var(--faint)}
@media (max-width:560px){.trow{grid-template-columns:minmax(0,1fr);gap:4px}}

.edu{display:grid;gap:8px;color:var(--muted)}

footer.contact{margin-top:80px;padding-block:56px 64px;border-top:2px solid var(--line-strong);display:grid;gap:20px}
footer.contact h2{font-size:clamp(26px,3vw,36px)}
.tg{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.handle{font-family:var(--mono);font-size:18px;user-select:all;padding:12px 14px;border:1px solid var(--line);border-radius:4px}
.copy{font:inherit;font-family:var(--mono);font-size:14px;background:transparent;border:1px solid var(--cell);color:var(--fg);border-radius:4px;padding:12px 14px;cursor:pointer;min-height:48px}
.copied{font-family:var(--mono);font-size:13px;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.case{transition:border-color .15s}.case:hover{border-color:var(--cell)}}
</style>
</head>
<body>

<nav class="top" aria-label="Main">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <div class="navlinks">
      <a href="#cases" data-t="navCases"></a>
      <a href="#method" data-t="navMethod"></a>
      <a href="#career" data-t="navCareer"></a>
      <a href="#contact" data-t="navContact"></a>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-ru" data-lang="ru">RU</button>
        <button type="button" id="lang-en" data-lang="en">EN</button>
      </div>
    </div>
  </div>
</nav>

<main class="wrap" id="top">
  <header class="hero">
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="headline"></h1>
    <p class="lead" id="lead"></p>
    <div class="ctas">
      <a class="btn primary" href="https://t.me/vizzotova" target="_blank" rel="noopener" data-t="ctaTask"></a>
      <a class="btn ghost" href="https://t.me/vizzotova" target="_blank" rel="noopener" data-t="ctaRole"></a>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <section class="block" id="skills-sec">
    <div class="sechead"><h2 data-t="skillsTitle"></h2></div>
    <div class="skills" id="skills"></div>
  </section>

  <section class="block" id="cases">
    <div class="sechead">
      <h2><span data-t="casesTitle"></span><small id="caseCount"></small></h2>
      <div class="filters" id="filters" role="group"></div>
    </div>
    <div class="cases" id="caseList"></div>
    <div>
      <h3 style="font-size:20px;margin-bottom:14px" data-t="wmsTitle"></h3>
      <div class="mini" id="wms"></div>
    </div>
  </section>

  <section class="block" id="method">
    <div class="sechead"><h2 data-t="methodTitle"></h2></div>
    <ol class="steps" id="steps"></ol>
    <blockquote class="insight" id="insight"></blockquote>
  </section>

  <section class="block" id="clients">
    <div class="sechead"><h2 data-t="clientsTitle"></h2></div>
    <div class="clients" id="clientList"></div>
    <div class="industries" id="industries"></div>
  </section>

  <section class="block" id="career">
    <div class="sechead"><h2 data-t="careerTitle"></h2></div>
    <div class="timeline" id="timeline"></div>
    <p class="note" data-t="careerNote"></p>
  </section>

  <section class="block" id="edu">
    <div class="sechead"><h2 data-t="eduTitle"></h2></div>
    <div class="edu" id="eduList"></div>
  </section>

  <footer class="contact" id="contact">
    <h2 data-t="contactTitle"></h2>
    <p style="color:var(--muted);max-width:60ch" data-t="contactText"></p>
    <div class="tg">
      <a class="btn primary" href="https://t.me/vizzotova" target="_blank" rel="noopener" data-t="contactBtn"></a>
      <span class="handle" id="handle">@vizzotova</span>
      <button type="button" class="copy" id="copyBtn" data-t="copy"></button>
      <span class="copied" id="copied" aria-live="polite"></span>
    </div>
  </footer>
</main>

    headline:{ru:'Проектирую учёт, в котором каждая вещь и каждый рубль на своём месте',en:'I design accounting where every item and every rouble has its place'},

  const v = V[VARIANT], u = UI[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => { const k = el.dataset.t; if (u[k] !== undefined) el.textContent = u[k]; });
  $('brand').innerHTML = v.brand[lang];
  $('eyebrow').textContent = v.eyebrow[lang];
  $('headline').textContent = v.headline[lang];
  $('lead').textContent = v.lead[lang];
  document.querySelector('[data-t="skillsTitle"]').textContent = v.skillsTitle[lang];
  ['ru','en'].forEach(l => $('lang-'+l).setAttribute('aria-pressed', l===lang ? 'true':'false'));

  $('stats').innerHTML = v.stats.map(s => `<div class="stat"><div class="code">${s.c}</div><div class="n">${esc(typeof s.n==='object'?s.n[lang]:s.n)}</div><div class="t">${esc(s[lang])}</div></div>`).join('');
  $('skills').innerHTML = v.skills.map(s => `<div class="skill"><h3>${esc(s[lang][0])}</h3><p>${esc(s[lang][1])}</p></div>`).join('');

  const usedTags = [...new Set(v.order.flatMap(k => CASES[k].tags))];
  $('filters').setAttribute('aria-label', lang==='ru'?'Фильтр по отрасли':'Filter by industry');
  $('filters').innerHTML = [['all',u.all],...usedTags.map(t=>[t,TAGS[t][lang]])]
    .map(([k,l]) => `<button type="button" class="chip" id="f-${k}" data-f="${k}" aria-pressed="${filter===k}">${esc(l)}</button>`).join('');

  const list = v.order.filter(k => filter==='all' || CASES[k].tags.includes(filter));
  $('caseCount').textContent = `[${list.length}]`;
  const cells = ['П-01','П-02','С-07','С-08','С-09','С-10','М-01','М-02'];
  $('caseList').innerHTML = list.map(k => {
    const c = CASES[k];
    const prod = (VARIANT==='product' && c.prod) ? `<div class="prodnotes"><div class="code">${u.prodLabel}</div><ul>${c.prod[lang].map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>` : '';
    const vis = c.cells ? `<div class="cells" aria-hidden="true">${cells.map((x,i)=>`<div class="${i===2?'on':''}">${x}</div>`).join('')}</div>` : '';
    return `<article class="case" id="case-${k}"><div class="body"><div class="eyebrow">${esc(c.code[lang])}</div><h3>${esc(c.title[lang])}</h3>
      <dl class="rows"><dt>${u.task}</dt><dd>${esc(c.task[lang])}</dd><dt>${u.solution}</dt><dd>${esc(c.sol[lang])}</dd><dt>${u.result}</dt><dd>${esc(c.res[lang])}</dd><dt>${u.role}</dt><dd>${esc(c.role[lang])}</dd></dl>${prod}</div>${vis}</article>`;
  }).join('');

  $('wms').innerHTML = WMS.map(w => `<div><b>${esc(w[lang][0])}</b><span>${esc(w[lang][1])}</span></div>`).join('');
  $('steps').innerHTML = v.steps[lang].map((s,i) => `<li><div class="code">${String(i+1).padStart(2,'0')}</div><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></li>`).join('');
  $('insight').textContent = v.insight[lang];
  $('clientList').innerHTML = CLIENTS[lang].map(c=>`<span>${esc(c)}</span>`).join('');
  $('industries').innerHTML = INDUSTRIES[lang].map(c=>`<span>${esc(c)}</span>`).join('');
  $('timeline').innerHTML = CAREER.map(r => {
    const d = (VARIANT==='product' && r['p'+lang]) ? r['p'+lang] : r[lang];
    return `<div class="trow"><div class="y">${r.y}</div><div><b>${esc(d[0])}</b><br><span>${esc(d[1])}</span></div></div>`;
  }).join('');
  $('eduList').innerHTML = EDU[lang].map(e=>`<div>${esc(e)}</div>`).join('');
  $('copied').textContent = '';
}

document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb){ lang = lb.dataset.lang; try{ localStorage.setItem('vz-lang', lang); }catch(_){} render(); return; }
  const fb = e.target.closest('[data-f]');
  if (fb){ filter = fb.dataset.f; render(); return; }
});
$('copyBtn').addEventListener('click', () => {
  const done = ok => { $('copied').textContent = ok ? UI[lang].copied : UI[lang].copyFail; };
  try{
    navigator.clipboard.writeText('@vizzotova').then(()=>done(true)).catch(()=>{ selectHandle(); done(false); });
  }catch(_){ selectHandle(); done(false); }
});
function selectHandle(){ const r = document.createRange(); r.selectNodeContents($('handle')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

try{ const saved = localStorage.getItem('vz-lang'); if (saved==='en'||saved==='ru') lang = saved; }catch(_){}
if (location.hash === '#en') lang = 'en';
render();
</script>
</body>
</html>
